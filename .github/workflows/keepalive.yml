name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: >
          curl -fsS --retry 3 --retry-all-errors --retry-delay 15 --max-time 120
          https://bank-midterm.onrender.com/health
